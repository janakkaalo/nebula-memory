name: Deploy to GitHub Pages

# Deploys this Vite app to GitHub Pages.
# First-time repo setup (once): Settings → Pages → Source: "GitHub Actions".
# Then push to main (or Run workflow manually) and the site goes live.
# The app uses hash routing (#/game), so no server-side rewrites are needed.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      # Pages hardening: hash routing needs no rewrites, but a 404 fallback
      # makes deep links resilient, and .nojekyll stops Jekyll processing.
      - run: Copy-Item dist/index.html dist/404.html
        shell: pwsh
      - run: New-Item -ItemType File -Path dist/.nojekyll -Force
        shell: pwsh
      - run: Get-ChildItem dist; Get-ChildItem dist/assets
        shell: pwsh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
